services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      API_CONFIG_FILE: /run/secrets/model_api
      DATA_DIR: /app/runtime
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8780,http://127.0.0.1:8780}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AGENT_RUNTIME: claude-sdk
      AGENT_SDK_AUTO_COMPACT: ${AGENT_SDK_AUTO_COMPACT:-true}
      AGENT_SDK_COMPACT_PCT: ${AGENT_SDK_COMPACT_PCT:-60}
      AGENT_SDK_SESSION_TTL_SECONDS: ${AGENT_SDK_SESSION_TTL_SECONDS:-604800}
      AGENT_SDK_MAX_SESSIONS: ${AGENT_SDK_MAX_SESSIONS:-30}
      AGENT_SDK_CONTEXT_USAGE: ${AGENT_SDK_CONTEXT_USAGE:-false}
      AGENT_SDK_BASE_URL: ${AGENT_SDK_BASE_URL:-https://api.deepseek.com/anthropic}
      MEMORY_CONTEXT_TOKENS: ${MEMORY_CONTEXT_TOKENS:-4096}
      MEMORY_CONTEXT_MAX_ITEMS: ${MEMORY_CONTEXT_MAX_ITEMS:-32}
      MEMORY_CONSOLIDATION_ENABLED: ${MEMORY_CONSOLIDATION_ENABLED:-true}
      MEMORY_CONSOLIDATE_SOURCES: ${MEMORY_CONSOLIDATE_SOURCES:-8}
      MEMORY_CONSOLIDATE_TOKENS: ${MEMORY_CONSOLIDATE_TOKENS:-1200}
      TEST_ACCOUNT_PASSWORD: ${TEST_ACCOUNT_PASSWORD:-}
    secrets:
      - model_api
    volumes:
      - memory_data:/app/runtime
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8781/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8780}:80"
    depends_on:
      backend:
        condition: service_healthy
secrets:
  model_api:
    file: ${API_CONFIG_PATH:-../api.json}
volumes:
  memory_data:
