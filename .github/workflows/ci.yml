name: Team checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Check tracked files
        run: python scripts/check_publish.py
      - name: Run tests without a model API key
        run: python -m pytest -q
      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/workbench.js
          node --check preview/adapter.js
      - name: Build isolated static preview
        run: python scripts/build_preview.py
      - name: Validate Docker Compose with a synthetic secret
        run: |
          printf '{"api_key":"ci-placeholder"}\n' > "$RUNNER_TEMP/model-api.json"
          API_CONFIG_PATH="$RUNNER_TEMP/model-api.json" docker compose config --quiet
