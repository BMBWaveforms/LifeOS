name: Static team preview
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'preview/**'
      - 'scripts/build_preview.py'
      - 'data/**'
      - 'docs/团队讲解/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public static preview with synthetic records
        run: python scripts/build_preview.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .preview-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
